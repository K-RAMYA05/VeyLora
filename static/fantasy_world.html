<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Arcane World</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
    :root {
      --overlay: rgba(15,23,42,0.78);
      --accent: #ffca5c;
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
    }
    * {
      box-sizing: border-box;
    }
    body {
      min-height: 90vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at top, #111827, #020617 55%, #020617 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .veil {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at top, rgba(15,23,42,0.2), transparent 60%),
        linear-gradient(to top, rgba(3,7,18,0.8), transparent);
    }
    .world-frame {
      position: relative;
      width: 73vw !important;
      height: 100vh;
      max-height: 95vh;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 26px 70px rgba(0,0,0,0.95), 0 0 0 2px rgba(250,204,21,0.9);
      background-image: url("/image/fantasy_world.jpeg");
      background-repeat: no-repeat;
      background-position: top center;
      filter: brightness(1.15) saturate(1.2);
      /* image stays static; no slow zoom/float animation */
    }
    .world-frame.locked {
      filter: grayscale(0.4) brightness(0.8);
    }
    .world-frame.locked::after {
      content: "Imposters observe only";
      position: absolute;
      inset: 0;
      background: rgba(2,6,23,0.72);
      color: #facc15;
      font-size: 1.1rem;
      letter-spacing: 0.18em;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      pointer-events: none;
    }

    .world-hotspot {
      position: absolute;
      border: none;
      background: transparent;
      cursor: pointer;
    }

    .world-hotspot:focus-visible {
      outline: 2px solid var(--accent);
    }

    .world-timer {
      position: absolute;
      right: 20px;
      top: 14px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.8);
      background: rgba(15,23,42,0.86);
      font-size: 11px;
      color: var(--text-main);
      box-shadow: 0 10px 24px rgba(0,0,0,0.8);
    }

    .world-players {
      position: fixed;
      left: 18px;
      top: 18px;
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid rgba(148,163,184,0.65);
      background: rgba(15,23,42,0.9);
      font-size: 11px;
      color: var(--text-main);
      box-shadow: 0 14px 30px rgba(0,0,0,0.75);
      max-width: 180px;
      z-index: 2;
    }
    .world-players-title {
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      margin-bottom: 2px;
    }
    .world-players-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .world-players-list li {
      margin: 0;
      padding: 0;
      color: var(--text-main);
    }

    .imposter-guess {
      position: fixed;
      left: 18px;
      bottom: 20px;
      padding: 6px 10px 8px;
      border-radius: 10px;
      border: 1px solid rgba(148,163,184,0.65);
      background: rgba(15,23,42,0.9);
      font-size: 11px;
      color: var(--text-main);
      box-shadow: 0 14px 30px rgba(0,0,0,0.75);
      max-width: 220px;
      z-index: 2;
    }
    .imposter-guess-title {
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      margin-bottom: 2px;
    }
    .imposter-guess-row {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }
    #guessImposterName {
      flex: 1;
      border-radius: 8px;
      border: 1px solid rgba(148,163,184,0.6);
      background: rgba(15,23,42,0.9);
      color: var(--text-main);
      padding: 3px 6px;
      font-size: 11px;
    }
    #btnSubmitGuess {
      border: none;
      border-radius: 8px;
      padding: 3px 8px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      background: linear-gradient(135deg, #f97316, #fb923c);
      color: #0f172a;
      cursor: pointer;
    }
    #guessStatus {
      margin-top: 3px;
      font-size: 10px;
      color: var(--text-muted);
    }

    .hint-hud {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(250,204,21,0.9);
      background: radial-gradient(circle at top, rgba(15,23,42,0.96), rgba(30,64,175,0.9));
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.9);
      z-index: 2;
    }

    .hint-hud-label {
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .hint-hud-status {
      color: var(--text-main);
    }

    .hint-hud button {
      padding: 6px 10px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      background: linear-gradient(135deg, #ffca5c, #f7a600);
      color: #111827;
      box-shadow: 0 10px 24px rgba(251,191,36,0.7);
    }

    .hint-hud button:hover {
      box-shadow: 0 16px 32px rgba(251,191,36,0.9);
      transform: translateY(-1px);
    }

    .world-timer {
      position: absolute;
      right: 20px;
      top: 14px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.8);
      background: rgba(15,23,42,0.86);
      font-size: 11px;
      color: var(--text-main);
      box-shadow: 0 10px 24px rgba(0,0,0,0.8);
    }

    .shell {
      position: relative;
      z-index: 1;
      max-width: 340px;
      width: 100%;
      margin: 16px;
      padding: 20px 22px 22px;
      border-radius: 24px;
      background: rgba(15,23,42,0.9);
      border: 1px solid rgba(148,163,184,0.55);
      box-shadow: 0 24px 60px rgba(0,0,0,0.9);
      position: fixed;
      right: 16px;
      top: 16px;
      bottom: 16px;
      display: flex;
      flex-direction: column;
      transform: translateX(0);
      transition: transform 180ms ease-out, opacity 180ms ease-out;
    }

    .shell-hidden {
      transform: translateX(120%);
      opacity: 0;
    }

    .shell-toggle {
      position: fixed;
      right: 16px;
      top: 50%;
      z-index: 2;
      transform: translateY(-50%);
      padding: 6px 10px;
      border-radius: 999px 0 0 999px;
      border: 1px solid rgba(148,163,184,0.7);
      background: rgba(15,23,42,0.9);
      color: var(--text-main);
      font-size: 11px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(0,0,0,0.85);
    }

    @keyframes worldFloat {
      0% {
        transform: translate3d(0, 0, 0) scale(1.02);
      }
      50% {
        transform: translate3d(-10px, -6px, 0) scale(1.04);
      }
      100% {
        transform: translate3d(8px, 4px, 0) scale(1.03);
      }
    }
    @keyframes worldShake {
      0% { transform: translate3d(0, 0, 0); }
      25% { transform: translate3d(-4px, 2px, 0); }
      50% { transform: translate3d(3px, -3px, 0); }
      75% { transform: translate3d(-2px, 1px, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }
    .world-shake {
      animation: worldShake 0.25s ease-out;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .title-block h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .title-block p {
      margin: 2px 0 0;
      font-size: 11px;
      color: var(--text-muted);
    }
    .timer-pill {
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.7);
      font-size: 11px;
      color: var(--text-muted);
    }
    .content {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
    }
    @media (max-width: 900px) {
      .content {
        grid-template-columns: minmax(0, 1fr);
      }
    }
    .hint-panel {
      font-size: 12px;
      color: var(--text-muted);
      border-radius: 16px;
      padding: 8px 10px;
      border: 1px solid rgba(148,163,184,0.55);
      background: radial-gradient(circle at top left, rgba(15,23,42,0.94), rgba(30,64,175,0.7));
    }

    .room-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: none;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, rgba(15,23,42,0.55), rgba(0,0,0,0.9));
      backdrop-filter: blur(10px);
    }

    .room-modal {
      max-width: 42vw;
      max-height: 70vh;
      border-radius: 20px;
      padding: 12px 12px 14px;
      background: rgba(15,23,42,0.96);
      border: 1px solid rgba(250,204,21,0.75);
      box-shadow: 0 26px 60px rgba(0,0,0,0.95);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .room-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }

    .room-modal-title {
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .room-modal-close {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
    }

    .room-modal-close:hover {
      color: var(--accent);
    }

    .room-image {
      width: 100%;
      max-height: 50vh;
      object-fit: contain;
      border-radius: 14px;
      border: 1px solid rgba(148,163,184,0.7);
      box-shadow: 0 18px 40px rgba(0,0,0,0.85);
    }

    .room-caption {
      font-size: 12px;
      color: var(--text-muted);
    }

    .room-image-wrapper {
      position: relative;
    }

    .artifact-hotspot {
      position: absolute;
      border: none;
      background: transparent;
      cursor: pointer;
    }

    .room-hint-button {
      margin-top: 6px;
      align-self: flex-start;
      padding: 6px 10px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      background: linear-gradient(135deg, #ffca5c, #f7a600);
      color: #111827;
      box-shadow: 0 10px 24px rgba(251,191,36,0.7);
    }

    .room-hint-button:hover {
      box-shadow: 0 16px 32px rgba(251,191,36,0.9);
      transform: translateY(-1px);
    }

    .imposter-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2,6,23,0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 5;
      backdrop-filter: blur(4px);
    }
    .imposter-card {
      width: min(90vw, 420px);
      padding: 20px 22px 24px;
      border-radius: 20px;
      background: radial-gradient(circle at top, rgba(15,23,42,0.98), rgba(3,7,18,0.92));
      border: 1px solid rgba(250,204,21,0.6);
      box-shadow: 0 30px 80px rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: var(--text-main);
    }
    .imposter-card h3 {
      margin: 0;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      font-size: 13px;
    }
    .imposter-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .imposter-base {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: rgba(191,219,254,0.9);
    }
    .imposter-base-text {
      padding: 10px;
      border-radius: 12px;
      border: 1px dashed rgba(148,163,184,0.5);
      min-height: 54px;
      color: #f1f5f9;
      font-size: 13px;
      background: rgba(15,23,42,0.6);
    }
    #imposterHintInput {
      width: 100%;
      min-height: 90px;
      resize: vertical;
      border-radius: 12px;
      border: 1px solid rgba(148,163,184,0.4);
      background: rgba(15,23,42,0.8);
      color: var(--text-main);
      padding: 10px;
      font-family: inherit;
    }
    .imposter-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .imposter-actions button {
      padding: 8px 12px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    #btnImposterPass {
      background: rgba(148,163,184,0.2);
      color: var(--text-main);
      border: 1px solid rgba(148,163,184,0.4);
    }
    #btnImposterManipulate {
      background: linear-gradient(135deg, #ffca5c, #f97316);
      color: #0f172a;
      box-shadow: 0 12px 24px rgba(251,191,36,0.6);
    }
    .world-players {
      position: fixed;
      left: 18px;
      top: 18px;
      padding: 6px 9px 8px;
      border-radius: 10px;
      border: 1px solid rgba(148,163,184,0.65);
      background: radial-gradient(circle at top, rgba(15,23,42,0.96), rgba(17,24,39,0.95));
      font-size: 11px;
      color: var(--text-main);
      box-shadow: 0 14px 30px rgba(0,0,0,0.75);
      max-width: 180px;
      z-index: 2;
    }
    .world-players-title {
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .world-players-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 6px;
    }
    .world-players-list li {
      margin: 0;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(30,64,175,0.6);
      border: 1px solid rgba(191,219,254,0.6);
      color: var(--text-main);
      font-size: 10px;
    }

    .imposter-guess-inner {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(55,65,81,0.85);
    }
    .imposter-guess-title {
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #facc15;
      margin-bottom: 4px;
      font-size: 10px;
    }
    #guessImposterName {
      width: 100%;
      border-radius: 8px;
      border: 1px solid rgba(148,163,184,0.6);
      background: rgba(15,23,42,0.9);
      color: var(--text-main);
      padding: 3px 6px;
      font-size: 11px;
      margin-bottom: 4px;
    }
    #btnSubmitGuess {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      background: linear-gradient(135deg, #f97316, #fb923c);
      color: #0f172a;
      cursor: pointer;
    }
    #guessStatus {
      margin-top: 3px;
      font-size: 10px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="veil" aria-hidden="true"></div>
  <div class="world-frame" id="worldFrame">
    <div class="world-timer"><span id="worldTimer">--:--</span></div>
    <!-- 8 hotspots over the world image, roughly aligned to the labeled rooms -->
    <!-- 1. Great Hall -->
    <button class="world-hotspot" data-room="Great Hall" data-id="1"
            style="left:0%; top:4%; width:28%; height:20%;"></button>
    <!-- 2. Potions Classroom -->
    <button class="world-hotspot" data-room="Potions Classroom" data-id="2"
            style="left:39%; top:6%; width:22%; height:18%;"></button>
    <!-- 3. Library -->
    <button class="world-hotspot" data-room="Library" data-id="3"
            style="left:69%; top:6%; width:22%; height:18%;"></button>
    <!-- 4. Herbology Greenhouse -->
    <button class="world-hotspot" data-room="Herbology Greenhouse" data-id="4"
            style="left:4%; top:38%; width:22%; height:20%;"></button>
    <!-- 5. Defense Classroom -->
    <button class="world-hotspot" data-room="Defense Classroom" data-id="5"
            style="left:69%; top:38%; width:22%; height:20%;"></button>
    <!-- 6. Common Room -->
    <button class="world-hotspot" data-room="Common Room" data-id="6"
            style="left:10%; top:67%; width:26%; height:22%;"></button>
    <!-- 7. Astronomy Tower -->
    <button class="world-hotspot" data-room="Astronomy Tower" data-id="7"
            style="left:41%; top:67%; width:22%; height:22%;"></button>
    <!-- 8. Headmaster's Office -->
    <button class="world-hotspot" data-room="Headmaster's Office" data-id="8"
            style="left:69%; top:67%; width:22%; height:22%;"></button>
  </div>
  <div class="hint-hud">
    <span class="hint-hud-label">Your hints</span>
    <span class="hint-hud-status" id="worldHintHelper">Loading…</span>
    <button id="btnManipulate" type="button" style="display:none;">Manipulate (10)</button>
  </div>
  <div class="world-players" id="worldPlayers" style="display:none;">
    <div class="world-players-title">Players</div>
    <ul class="world-players-list" id="worldPlayersList"></ul>
    <div class="imposter-guess-inner" id="imposterGuessBox" style="display:none;">
      <div class="imposter-guess-title">Guess imposter</div>
      <input id="guessImposterName" type="text" autocomplete="off" placeholder="Type a name" />
      <button id="btnSubmitGuess" type="button">Guess</button>
      <div id="guessStatus"></div>
    </div>
  </div>
  <div class="imposter-overlay" id="imposterHintOverlay">
    <div class="imposter-card">
      <h3>Clandestine relay</h3>
      <div class="imposter-meta">
        <span id="imposterHintRoom"></span>
        <span id="imposterHintArtifact"></span>
        <span id="imposterHintQuota"></span>
      </div>
      <div class="imposter-base">Original clue</div>
      <div class="imposter-base-text" id="imposterHintBase"></div>
      <label class="imposter-base" for="imposterHintInput">Send to seeker</label>
      <textarea id="imposterHintInput" spellcheck="false"></textarea>
      <div class="imposter-actions">
        <button id="btnImposterPass" type="button">Pass original</button>
        <button id="btnImposterManipulate" type="button">Send manipulation</button>
      </div>
    </div>
  </div>
  <div class="room-modal-overlay" id="roomModal">
    <div class="room-modal">
      <div class="room-modal-header">
        <div class="room-modal-title" id="roomTitle">Room</div>
        <button class="room-modal-close" id="roomClose" aria-label="Close room view">×</button>
      </div>
      <div class="room-image-wrapper">
        <img id="roomImage" class="room-image" alt="Selected room view"/>
        <!-- Two generic hotspots; configured per room via JS -->
        <button class="artifact-hotspot" id="artifactHotspot1" data-artifact="" style="display:none;"></button>
        <button class="artifact-hotspot" id="artifactHotspot2" data-artifact="" style="display:none;"></button>
      </div>
      <div class="room-caption" id="roomCaption"></div>
      <div id="hints" style="max-height:140px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; margin-top:6px;"></div>
      <button id="btnRequestHint" type="button" class="room-hint-button">Request hint</button>
    </div>
  </div>
  <!-- sidebar removed; using compact hint HUD instead -->
  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session') || '';
    const username = params.get('name') || '';

    const helperEl = document.getElementById('worldHintHelper');
    const hintsEl = document.getElementById('hints');
    const btnHint = document.getElementById('btnRequestHint');
    const btnManipulate = document.getElementById('btnManipulate');
    const timerLabelEl = document.getElementById('worldTimer');
    const roomModalEl = document.getElementById('roomModal');
    const roomImageEl = document.getElementById('roomImage');
    const roomTitleEl = document.getElementById('roomTitle');
    const roomCaptionEl = document.getElementById('roomCaption');
    const roomCloseBtn = document.getElementById('roomClose');
    const hotspot1 = document.getElementById('artifactHotspot1');
    const hotspot2 = document.getElementById('artifactHotspot2');
    const playersShell = document.getElementById('worldPlayers');
    const playersListEl = document.getElementById('worldPlayersList');
    const guessBoxEl = document.getElementById('imposterGuessBox');
    const guessInputEl = document.getElementById('guessImposterName');
    const guessBtnEl = document.getElementById('btnSubmitGuess');
    const guessStatusEl = document.getElementById('guessStatus');
    const impOverlay = document.getElementById('imposterHintOverlay');
    const impRoomLabel = document.getElementById('imposterHintRoom');
    const impArtifactLabel = document.getElementById('imposterHintArtifact');
    const impQuotaLabel = document.getElementById('imposterHintQuota');
    const impBaseText = document.getElementById('imposterHintBase');
    const impInput = document.getElementById('imposterHintInput');
    const btnImposterPass = document.getElementById('btnImposterPass');
    const btnImposterManipulate = document.getElementById('btnImposterManipulate');

    const socket = io();
    socket.onAny((event, ...args) => {
      console.log('[socket event]', event, args);
    });
    const my = { session: sessionId, name: username };
    let hintsUnlocked = true; // we only arrive here after hints_ready
    let hintsLeft = 0;
    let hintsUsed = 0;
    let artifactsLeft = null;
    // visible game score: starts at 0 and only changes when artifacts are found
    let myScore = 0;
    let isImposter = false;
    let manipLeft = 10;
    let delayLeft = 0;
    let currentRoom = null;
    let baseHintQuota = null; // initial total hints for this player
    let hintRequestPending = false;
    let mapLockedForImposter = false;
    let pendingImposterHint = null;
    let registeredWorldName = null;
    const roomHints = {};
    let imposterPollTimer = null;
    let lastPolledPendingId = null;
    let requesterPollTimer = null;

    const ROOM_ARTIFACTS = {
      'Great Hall': ['Goblet of Echoes', 'Singing Chalice'],
      'Potions Classroom': ['Dragon Scale', 'Moonstone Amulet'],
      'Library': ['Elder Grimoire', 'Spellbound Quill'],
      'Herbology Greenhouse': ['Runed Lantern'],
      'Defense Classroom': ['Wand of Whisper'],
      'Common Room': ['Cloak of Mist'],
      'Astronomy Tower': ['Starlight Compass', 'Time-Twined Hourglass'],
      "Headmaster's Office": ['Phoenix Feather']
    };

    // Rough hotspot positions for each room image (percentages over the room image)
    const ROOM_HOTSPOT_POS = {
      'Great Hall': [
        { left: '46%', top: '71%', width: '6%', height: '12%' }, // Goblet of Echoes
        { left: '54%', top: '74%', width: '6%', height: '12%' }  // Singing Chalice
      ],
      'Potions Classroom': [
        { left: '40%', top: '55%', width: '8%', height: '14%' }, // Dragon Scale
        { left: '58%', top: '40%', width: '8%', height: '14%' }  // Moonstone Amulet
      ],
      'Library': [
        { left: '30%', top: '50%', width: '10%', height: '20%' }, // Elder Grimoire
        { left: '60%', top: '45%', width: '8%', height: '16%' }   // Spellbound Quill
      ],
      'Herbology Greenhouse': [
        { left: '50%', top: '55%', width: '10%', height: '18%' }  // Runed Lantern
      ],
      'Defense Classroom': [
        { left: '55%', top: '60%', width: '8%', height: '18%' }   // Wand of Whisper
      ],
      'Common Room': [
        { left: '50%', top: '65%', width: '12%', height: '20%' }  // Cloak of Mist
      ],
      'Astronomy Tower': [
        { left: '45%', top: '40%', width: '10%', height: '18%' }, // Starlight Compass
        { left: '60%', top: '55%', width: '10%', height: '18%' }  // Time-Twined Hourglass
      ],
      "Headmaster's Office": [
        { left: '55%', top: '40%', width: '10%', height: '18%' }  // Phoenix Feather
      ]
    };

    function canonicalRoomKey(name) {
      if (!name) return 'unknown-room';
      return name
        .replace(/[\u2018\u2019]/g, "'")
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase() || 'unknown-room';
    }

    function displayRoomName(name) {
      const trimmed = (name || '').trim();
      return trimmed.length ? trimmed : 'Unknown Room';
    }

    function configureRoomHotspots(roomName) {
      if (!hotspot1 || !hotspot2) return;
      const artifacts = ROOM_ARTIFACTS[roomName] || [];
      const positions = ROOM_HOTSPOT_POS[roomName] || [];

      const hotspots = [hotspot1, hotspot2];
      hotspots.forEach((btn, idx) => {
        const art = artifacts[idx];
        const pos = positions[idx];
        if (art && pos) {
          btn.style.display = 'block';
          btn.dataset.artifact = art;
          btn.style.left = pos.left;
          btn.style.top = pos.top;
          btn.style.width = pos.width;
          btn.style.height = pos.height;
        } else {
          btn.style.display = 'none';
          btn.dataset.artifact = '';
        }
      });
    }

    function buildHintCard(entry) {
      const card = document.createElement('div');
      card.style.borderRadius = '10px';
      card.style.border = '1px solid rgba(148,163,184,0.7)';
      card.style.background = 'linear-gradient(135deg, rgba(15,23,42,0.98), rgba(56,189,248,0.9))';
      card.style.padding = '8px 9px 7px';
      card.style.fontSize = '12px';
      card.style.boxShadow = '0 10px 18px rgba(15,23,42,0.85)';

      const art = document.createElement('div');
      art.style.fontSize = '11px';
      art.style.textTransform = 'uppercase';
      art.style.letterSpacing = '0.14em';
      art.style.color = 'rgba(191,219,254,0.95)';
      art.style.marginBottom = '2px';
      art.textContent = entry.artifact || 'Unknown artifact';

      const roomLine = document.createElement('div');
      roomLine.style.fontSize = '11px';
      roomLine.style.color = 'rgba(191,219,254,0.8)';
      roomLine.style.marginBottom = '2px';
      roomLine.textContent = 'Room: ' + (entry.roomDisplay || displayRoomName(entry.room));

      const text = document.createElement('div');
      text.style.fontSize = '12px';
      text.style.color = '#e5e7eb';
      text.textContent = entry.clue || 'The parchment arrives blank…';
      if (!entry.clue) {
        text.style.fontStyle = 'italic';
      }

      const meta = document.createElement('div');
      meta.style.marginTop = '4px';
      meta.style.fontSize = '10px';
      meta.style.textTransform = 'uppercase';
      meta.style.letterSpacing = '0.16em';
      meta.style.color = 'rgba(148,163,184,0.9)';
      meta.textContent = entry.manipulated
        ? 'Hint channel · the words feel distorted'
        : 'Hint channel · beware of illusions';

      card.appendChild(art);
      card.appendChild(roomLine);
      card.appendChild(text);
      card.appendChild(meta);
      return card;
    }

    function renderRoomHints(roomName) {
      if (!hintsEl) return;
      const key = canonicalRoomKey(roomName);
      const list = roomHints[key] || [];
      hintsEl.innerHTML = '';
      list.forEach(entry => {
        hintsEl.appendChild(buildHintCard(entry));
      });
    }

    function renderPlayersList(players) {
      if (!playersShell || !playersListEl) return;
      if (!players || !players.length) {
        playersShell.style.display = 'none';
        return;
      }
      playersShell.style.display = 'block';
      playersListEl.innerHTML = '';
      players.forEach(p => {
        const li = document.createElement('li');
        li.textContent = p.name || '';
        playersListEl.appendChild(li);
      });
      // Guess UI visibility is handled separately based on role
      if (guessBoxEl && !isImposter) {
        guessBoxEl.style.display = 'block';
      }
    }

    function storeRoomHint(entry) {
      const key = canonicalRoomKey(entry.room);
      entry.roomDisplay = entry.roomDisplay || displayRoomName(entry.room);
      roomHints[key] = roomHints[key] || [];
      roomHints[key].unshift(entry);
      if (roomHints[key].length > 20) {
        roomHints[key].pop();
      }
      if (canonicalRoomKey(currentRoom) === key) {
        renderRoomHints(currentRoom);
      }
    }

    function finalizeHintRequestState() {
      hintRequestPending = false;
      if (btnHint) {
        btnHint.disabled = hintsLeft <= 0;
      }
    }

    function updateMapInteractivity() {
      mapLockedForImposter = !!isImposter;
      if (!worldFrameEl) return;
      if (mapLockedForImposter) {
        worldFrameEl.classList.add('locked');
        worldFrameEl.style.pointerEvents = 'none';
      } else {
        worldFrameEl.classList.remove('locked');
        worldFrameEl.style.pointerEvents = '';
      }
    }

    function showImposterPrompt(payload) {
      pendingImposterHint = payload;
      if (!impOverlay || !impInput || !btnImposterManipulate || !btnImposterPass) {
        // Fallback to simple confirm/prompt if the overlay cannot render.
        const baseClue = payload.base_clue || '';
        const info =
          `Wizard ${payload.requester} seeks aid in ${payload.room}.\n` +
          `Artifact: ${payload.artifact || 'Unknown artifact'}\n\n` +
          `Original clue:\n${baseClue || '(none)'}\n\n` +
          `OK: manipulate (${manipLeft} left)\nCancel: pass original`;
        const wantsManip = window.confirm(info);
        if (!wantsManip || manipLeft <= 0) {
          socket.emit('imposter_hint_action', {
            session_id: my.session,
            pending_id: payload.pending_id,
            action: 'pass',
            clue: baseClue
          });
          pendingImposterHint = null;
          return;
        }
        const newClue = window.prompt('Enter the manipulated clue (blank for silence).', baseClue || '');
        socket.emit('imposter_hint_action', {
          session_id: my.session,
          pending_id: payload.pending_id,
          action: 'manipulate',
          clue: newClue === null ? baseClue : newClue
        });
        pendingImposterHint = null;
        return;
      }
      if (impRoomLabel) {
        impRoomLabel.textContent = `Room: ${payload.room || 'Unknown chamber'}`;
      }
      if (impArtifactLabel) {
        impArtifactLabel.textContent = `Artifact: ${payload.artifact || 'Unseen relic'}`;
      }
      if (impQuotaLabel) {
        impQuotaLabel.textContent = `Manipulations left: ${manipLeft}`;
      }
      if (impBaseText) {
        impBaseText.textContent = payload.base_clue || '(No clue supplied)';
      }
      if (impInput) {
        impInput.value = payload.base_clue || '';
        impInput.focus();
      }
      impOverlay.style.display = 'flex';
    }

    function closeImposterPrompt() {
      if (impOverlay) {
        impOverlay.style.display = 'none';
      }
      pendingImposterHint = null;
    }

    function updateHintHelperText() {
      if (!helperEl) return;
      if (isImposter) {
        helperEl.textContent = `You are the imposter. Manipulations left: ${manipLeft}. Use your power wisely.`;
        if (btnHint) btnHint.style.display = 'none';
        if (btnManipulate) {
          btnManipulate.style.display = 'inline-block';
          btnManipulate.textContent = `Manipulate (${manipLeft})`;
        }
      } else {
        const effectiveUsed =
          baseHintQuota !== null ? Math.max(0, baseHintQuota - hintsLeft) : hintsUsed;
        const baseStatus = `Hints left: ${hintsLeft} · Used: ${effectiveUsed}`;
        const displayScore = Math.round(myScore || 0);
        const extra = artifactsLeft !== null ? ` · Artifacts left: ${artifactsLeft} · Score: ${displayScore}` : '';
        helperEl.textContent = baseStatus + extra;
        if (btnHint) {
          btnHint.style.display = 'inline-block';
          btnHint.disabled = hintsLeft <= 0;
        }
        if (btnManipulate) btnManipulate.style.display = 'none';
      }
    }

    function syncStateFromStatus(data) {
      if (!data) return;
      const players = data.players || [];
      let me = players.find(p => p.name === username);
      if (!me && my.name) {
        me = players.find(p => p.name === my.name);
      }
      if (me && me.name) {
        my.name = me.name;
        ensureWorldRegistration(me.name);
      }
      if (typeof data.artifacts_total === 'number' && typeof data.artifacts_claimed === 'number') {
        artifactsLeft = Math.max(0, data.artifacts_total - data.artifacts_claimed);
      }
      renderPlayersList(players);
      if (me) {
        if (typeof me.imposter === 'boolean') {
          isImposter = me.imposter;
        } else {
          // fall back: treat zero-hint-at-start as imposter
          isImposter = (me.hints_left || 0) === 0;
        }
        if (isImposter && typeof data.manipulations_left === 'number') {
          manipLeft = data.manipulations_left;
        }
        // use backend game score (artifacts found only)
        if (typeof me.score === 'number') {
          myScore = me.score;
        }
        if (typeof me.hints_allowed === 'number' && baseHintQuota === null) {
          baseHintQuota = me.hints_allowed;
        }
        if (typeof me.hints_left === 'number') {
          hintsLeft = me.hints_left;
        }
        // derive hints used from quota and left if possible
        if (baseHintQuota !== null && typeof me.hints_left === 'number') {
          hintsUsed = Math.max(0, baseHintQuota - me.hints_left);
        } else if (typeof me.hints_used === 'number') {
          hintsUsed = me.hints_used;
        }
        updateHintHelperText();
        updateMapInteractivity();
        if (guessBoxEl) {
          guessBoxEl.style.display = isImposter ? 'none' : 'block';
        }
        // Start a lightweight HTTP polling fallback on the imposter
        // view so pending hints are not missed even if the Socket.IO
        // event is dropped.
        if (isImposter && !imposterPollTimer && sessionId && my.name) {
          imposterPollTimer = setInterval(() => {
            fetch(`/pending_hint?session_id=${encodeURIComponent(sessionId)}&username=${encodeURIComponent(my.name)}`)
              .then(r => r.ok ? r.json() : {})
              .then(payload => {
                if (!payload || !payload.pending_id) return;
                if (pendingImposterHint && pendingImposterHint.pending_id === payload.pending_id) return;
                if (lastPolledPendingId === payload.pending_id) return;
                lastPolledPendingId = payload.pending_id;
                if (typeof payload.manipulations_left === 'number') {
                  manipLeft = payload.manipulations_left;
                  updateHintHelperText();
                }
                showImposterPrompt(payload);
              })
              .catch(() => {});
          }, 2000);
        }
      } else if (helperEl) {
        helperEl.textContent = 'You are in the realm as an observer.';
        updateMapInteractivity();
      }
    }

    function loadSessionState() {
      if (!sessionId) {
        if (helperEl) helperEl.textContent = 'Missing session id in URL.';
        return;
      }
      fetch(`/status/${encodeURIComponent(sessionId)}`)
        .then(r => r.json())
        .then(syncStateFromStatus)
        .catch(() => {
          if (helperEl) helperEl.textContent = 'Unable to load session state.';
        });
    }

    // Make the world image clickable via 8 hotspots placed over the artwork.
    const worldFrameEl = document.getElementById('worldFrame');

    const SOUND_SOURCES = {
      room: '/static/audio/room.wav',
      probe: '/static/audio/probe.wav',
      found: '/static/audio/found.wav',
    };
    const soundCache = {};

    function playSound(name, volume = 0.9) {
      const src = SOUND_SOURCES[name];
      if (!src) return;
      let audio = soundCache[name];
      if (!audio) {
        audio = new Audio(src);
        audio.preload = 'auto';
        soundCache[name] = audio;
      }
      try {
        audio.currentTime = 0;
        audio.volume = volume;
        audio.play().catch(() => {});
      } catch (err) {}
    }

    function playRoomClickSound() {
      playSound('room', 0.85);
    }

    function playArtifactFoundSound() {
      playSound('found', 0.95);
    }

    function playArtifactProbeSound() {
      playSound('probe', 0.9);
    }

    if (worldFrameEl) {
      const ROOM_CAPTIONS = {
        'Great Hall': 'A vast chamber of floating candles and echoing footsteps. Artifacts here tend to hide in plain sight among feasts and banners.',
        'Potions Classroom': 'Glowing brews and arcane instruments hum. Relics lurk near cauldrons, shelves, and chalk circles.',
        'Library': 'Shelves spiral into the shadows. Relics lurk between forgotten tomes and moonlit reading alcoves.',
        'Herbology Greenhouse': 'Glass domes and rare plants refract starlight; artifacts disguise themselves as crystal, root, or stone.',
        'Defense Classroom': 'Runic circles and training dummies surround a central focus. Look near chalk sigils and weapon racks.',
        'Common Room': 'A warm hearth and deep armchairs. Items hide among cushions, tables, and mantlepieces.',
        'Astronomy Tower': 'Wind howls around telescopes and parapets. Sky‑touched artifacts cling to ledges and rafters.',
        'Headmaster\'s Office': 'Portraits, cabinets, and a grand desk. Powerful artifacts are kept close, but rarely in plain sight.'
      };
      worldFrameEl.addEventListener('click', (ev) => {
        if (mapLockedForImposter) {
          alert('As the imposter, you cannot search the grounds.');
          return;
        }
        const hotspot = ev.target.closest('.world-hotspot');
        if (!hotspot) return;
        const room = hotspot.getAttribute('data-room') || 'Unknown room';
        const id = hotspot.getAttribute('data-id');
        currentRoom = room;
        if (roomModalEl && roomImageEl && roomTitleEl && roomCaptionEl && id) {
          roomImageEl.src = '/image/rooms/' + String(id) + '.png';
          roomTitleEl.textContent = room;
          roomCaptionEl.textContent = ROOM_CAPTIONS[room] || 'A mysterious chamber where artifacts may lurk in the shadows.';
          configureRoomHotspots(room);
          roomModalEl.style.display = 'flex';
          playRoomClickSound();
          worldFrameEl.classList.add('world-shake');
          setTimeout(() => worldFrameEl.classList.remove('world-shake'), 250);
          renderRoomHints(room);
        }
      });
    }

    if (roomCloseBtn && roomModalEl) {
      roomCloseBtn.onclick = () => {
        roomModalEl.style.display = 'none';
        // When leaving a room, refresh hint counts and artifacts/score
        // from the server so HUD is always correct.
        if (sessionId) {
          fetch(`/status/${encodeURIComponent(sessionId)}`)
            .then(r => r.json())
            .then(syncStateFromStatus)
            .catch(() => {});
        }
      };
    }

    // Clicking artifact hotspots submits the corresponding artifact id.
    function submitArtifactFromHotspot(btn) {
      if (!btn) return;
      const artifactId = btn.dataset.artifact;
      if (!artifactId) return;
      playArtifactProbeSound();
      if (!my.session || !my.name) {
        alert('Join a session first.');
        return;
      }
      socket.emit('submit_artifact', {
        session_id: my.session,
        username: my.name,
        artifact_id: artifactId
      });
    }

    if (hotspot1) {
      hotspot1.addEventListener('click', () => submitArtifactFromHotspot(hotspot1));
    }
    if (hotspot2) {
      hotspot2.addEventListener('click', () => submitArtifactFromHotspot(hotspot2));
    }

    function ensureWorldRegistration(name) {
      if (!sessionId) return;
      if (!name) return;
      if (registeredWorldName === name) return;
      registeredWorldName = name;
      socket.emit('join_world_view', { session_id: sessionId, username: name });
    }

    if (sessionId) {
      ensureWorldRegistration(username || my.name || '');
    }

    if (btnHint) {
      btnHint.onclick = () => {
        if (!hintsUnlocked) {
          alert('Hints are not available yet.');
          return;
        }
        if (hintRequestPending) {
          alert('A hint request is already pending. Wait for the current clue.');
          return;
        }
        if (!my.session || !my.name) {
          alert('Missing session or name in URL.');
          return;
        }
        if (!currentRoom) {
          alert('Step into a room on the map before requesting a hint.');
          return;
        }
        hintRequestPending = true;
        if (btnHint) btnHint.disabled = true;
        console.log('[request_hint] emit', my.session, my.name, currentRoom);
        socket.emit('request_hint', { session_id: my.session, username: my.name, room: currentRoom });
        // Start requester HTTP polling fallback so the hint arrives even
        // if the Socket.IO 'hint_response' event is missed.
        if (!requesterPollTimer && sessionId && my.name) {
          requesterPollTimer = setInterval(() => {
            fetch(`/latest_hint?session_id=${encodeURIComponent(sessionId)}&username=${encodeURIComponent(my.name)}`)
              .then(r => r.ok ? r.json() : {})
              .then(d => {
                if (!d || !d.clue) return;
                // Process as if it came from the Socket.IO channel.
                const complete = () => finalizeHintRequestState();
                // Only the requester should process this hint.
                if (d.requester && d.requester !== username && d.requester !== my.name) {
                  return;
                }
                const hasClueText = typeof d.clue === 'string' && d.clue.trim().length > 0;
                const displayClue = hasClueText ? d.clue : 'The parchment arrives blank…';
                const rawRoomName = d.room || currentRoom;
                const roomDisplay = displayRoomName(rawRoomName);
                alert(`(${roomDisplay}) ${displayClue}`);

                const entry = {
                  room: rawRoomName,
                  roomDisplay,
                  artifact: d.artifact || 'Unknown artifact',
                  clue: displayClue,
                  manipulated: !!d.manipulated,
                };
                storeRoomHint(entry);
                if (hintsEl) {
                  hintsEl.prepend(buildHintCard(entry));
                }
                hintsUsed += 1;
                if (hintsLeft > 0) {
                  hintsLeft -= 1;
                }
                updateHintHelperText();
                if (sessionId) {
                  fetch(`/status/${encodeURIComponent(sessionId)}`)
                    .then(r => r.json())
                    .then(syncStateFromStatus)
                    .catch(() => {});
                }
                complete();
              })
              .catch(() => {});
          }, 2000);
        }
      };
    }

    socket.on('hint_prompt', (payload) => {
      console.log('[hint_prompt] raw payload', payload);
      if (!payload || !payload.pending_id) return;
      const targetName = (payload.imposter || '').trim().toLowerCase();
      const localNameRaw = my.name || username || '';
      const localName = (localNameRaw || '').trim().toLowerCase();
      // Only the imposter (by name) should see this overlay.
      if (targetName && localName && targetName !== localName) {
        console.warn('[hint_prompt] ignored for non-matching player', localNameRaw, 'target', payload.imposter);
        return;
      }
      console.log('[imposter] hint_prompt received', payload);
      if (typeof payload.manipulations_left === 'number') {
        manipLeft = payload.manipulations_left;
        updateHintHelperText();
      }

      pendingImposterHint = payload;
      const artifactLabel = payload.artifact || 'Unknown artifact';
      const baseClue = payload.base_clue || '';
      if (!(impOverlay && impRoomLabel && impArtifactLabel && impQuotaLabel && impBaseText && impInput)) {
        console.warn('[hint_prompt] overlay not ready');
        return;
      }
      impRoomLabel.textContent = `Room: ${payload.room || 'Unknown chamber'}`;
      impArtifactLabel.textContent = `Artifact: ${artifactLabel}`;
      impQuotaLabel.textContent = `Manipulations left: ${manipLeft}`;
      impBaseText.textContent = baseClue || '(No clue supplied)';
      impInput.value = baseClue || '';
      impOverlay.style.display = 'flex';
    });

    function sendImposterDecision(action) {
      if (!pendingImposterHint) {
        closeImposterPrompt();
        return;
      }
      const baseClue = pendingImposterHint.base_clue || '';
      let finalClue = baseClue;
      if (action === 'manipulate') {
        if (manipLeft <= 0) {
          alert('No manipulations left; send the original clue.');
          return;
        }
        finalClue = impInput ? impInput.value || '' : '';
      }
      socket.emit('imposter_hint_action', {
        session_id: my.session,
        pending_id: pendingImposterHint.pending_id,
        action,
        clue: finalClue,
        username: my.name
      });
      console.log('[imposter] overlay decision sent', action);
      closeImposterPrompt();
    }

    function wireImposterButtons() {
      if (btnImposterPass && !btnImposterPass.dataset.bound) {
        btnImposterPass.dataset.bound = '1';
        btnImposterPass.addEventListener('click', () => sendImposterDecision('pass'));
      }
      if (btnImposterManipulate && !btnImposterManipulate.dataset.bound) {
        btnImposterManipulate.dataset.bound = '1';
        btnImposterManipulate.addEventListener('click', () => sendImposterDecision('manipulate'));
      }
    }
    wireImposterButtons();

    socket.on('hint_action_ack', (payload) => {
      if (typeof payload.manipulations_left === 'number') {
        manipLeft = payload.manipulations_left;
        updateHintHelperText();
      }
      if (payload.error) {
        alert(payload.error);
      }
    });

    socket.on('hint_response', (d) => {
      const complete = () => finalizeHintRequestState();
      if (d.error) {
        complete();
        alert('Hint error: ' + d.error);
        return;
      }
      // Only the requester should process this hint.
      if (d.requester && d.requester !== username && d.requester !== my.name) {
        return;
      }
      const hasClueText = typeof d.clue === 'string' && d.clue.trim().length > 0;
      const displayClue = hasClueText ? d.clue : 'The parchment arrives blank…';
      const rawRoomName = d.room || currentRoom;
      const roomDisplay = displayRoomName(rawRoomName);
      alert(`(${roomDisplay}) ${displayClue}`);

      const entry = {
        room: rawRoomName,
        roomDisplay,
        artifact: d.artifact || 'Unknown artifact',
        clue: displayClue,
        manipulated: !!d.manipulated,
      };
      // update in-memory history for this room
      storeRoomHint(entry);
      // and immediately show it in the current room panel
      if (hintsEl) {
        hintsEl.prepend(buildHintCard(entry));
      }
      // Optimistically update, then resync from server
      hintsUsed += 1;
      if (hintsLeft > 0) {
        hintsLeft -= 1;
      }
      updateHintHelperText();

      if (sessionId) {
        fetch(`/status/${encodeURIComponent(sessionId)}`)
          .then(r => r.json())
          .then(syncStateFromStatus)
          .catch(() => {});
      }
      complete();
    });

    let localSeconds = null;
    let timerInterval = null;

    function updateTimerDisplay(seconds) {
      if (!timerLabelEl) return;
      const s = Math.max(0, seconds | 0);
      const m = Math.floor(s / 60);
      const r = s % 60;
      const text =
        (m < 10 ? '0' + m : String(m)) +
        ':' +
        (r < 10 ? '0' + r : String(r));
      timerLabelEl.textContent = text;
    }

    socket.on('time_tick', (d) => {
      if (typeof d.time_left === 'number') {
        if (localSeconds === null || d.time_left < localSeconds) {
          localSeconds = d.time_left;
          updateTimerDisplay(localSeconds);
        }
        if (!timerInterval) {
          timerInterval = setInterval(() => {
            if (localSeconds === null) return;
            localSeconds = Math.max(0, localSeconds - 1);
            updateTimerDisplay(localSeconds);
          }, 1000);
        }
      }
    });

    socket.on('artifact_update', (d) => {
      if (!d || !d.result) return;
      const res = d.result;
      if (typeof res.artifacts_remaining === 'number') {
        artifactsLeft = res.artifacts_remaining;
      }
      if (d.username === username && typeof res.score === 'number') {
        myScore = res.score;
      }
      updateHintHelperText();
    });

    socket.on('artifact_update', (d) => {
      if (!d || !d.result) return;
      const res = d.result;
      if (typeof res.artifacts_remaining === 'number') {
        artifactsLeft = res.artifacts_remaining;
      }
      if (d.username === username && typeof res.score === 'number') {
        myScore = res.score;
      }
      // If this artifact was claimed, hide any matching hotspot so no one
      // can click it again.
      const claimedId = res.artifact_id;
      if (claimedId) {
        [hotspot1, hotspot2].forEach(btn => {
          if (!btn) return;
          if (btn.dataset.artifact === claimedId) {
            btn.style.display = 'none';
            btn.dataset.artifact = '';
          }
        });
      }
      updateHintHelperText();
      if (res.ok && d.username === username) {
        playArtifactFoundSound();
        alert('You found an artifact!');
      }
    });
    socket.on('player_list', (payload) => {
      if (!payload) return;
      renderPlayersList(payload.players || []);
    });

    if (guessBtnEl && guessInputEl) {
      let guessSubmitted = false;
      const submitGuess = () => {
        if (guessSubmitted) {
          if (guessStatusEl) guessStatusEl.textContent = 'You have already guessed.';
          return;
        }
        const name = (guessInputEl.value || '').trim();
        if (!name) {
          if (guessStatusEl) guessStatusEl.textContent = 'Type a name to guess.';
          return;
        }
        if (!my.session || !my.name) {
          alert('Missing session or name in URL.');
          return;
        }
        socket.emit('vote_imposter', {
          session_id: my.session,
          username: my.name,
          vote: name,
        });
        guessSubmitted = true;
        guessInputEl.disabled = true;
        guessBtnEl.disabled = true;
        if (guessStatusEl) guessStatusEl.textContent = 'Guess submitted.';
      };
      guessBtnEl.addEventListener('click', submitGuess);
      guessInputEl.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') {
          ev.preventDefault();
          submitGuess();
        }
      });
    }

    socket.on('vote_results', (payload) => {
      if (!payload) return;
      const voted = payload.voted_imposter || 'Unknown';
      const actual = payload.actual_imposter || 'Unknown';
      const msg = voted === actual
        ? `Majority guessed ${voted}, which is correct!`
        : `Majority guessed ${voted}, but the imposter was ${actual}.`;
      alert(msg);
    });

    socket.on('game_over', (d) => {
      alert('Game Over: ' + (d.reason || 'check main tab for results.'));
    });

    loadSessionState();
  </script>
</body>
</html>
