<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Arcane World</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
    :root {
      --overlay: rgba(15,23,42,0.78);
      --accent: #ffca5c;
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
    }
    * {
      box-sizing: border-box;
    }
    body {
      min-height: 90vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at top, #111827, #020617 55%, #020617 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .veil {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at top, rgba(15,23,42,0.2), transparent 60%),
        linear-gradient(to top, rgba(3,7,18,0.8), transparent);
    }
    .world-frame {
      position: relative;
      
      width: 85vw !important;
      height: 95vh;
      max-height: 90vh;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 26px 70px rgba(0,0,0,0.95), 0 0 0 2px rgba(250,204,21,0.9);
      background-image: url("/image/fantasy_world.jpeg");
      
      
      background-repeat: no-repeat;
      background-position: top center;
      filter: brightness(1.15) saturate(1.2);
      animation: worldFloat 36s ease-in-out infinite alternate;
    }

    .world-hotspot {
      position: absolute;
      border: none;
      background: transparent;
      cursor: pointer;
    }

    .world-hotspot:focus-visible {
      outline: 2px solid var(--accent);
    }

    .world-timer {
      position: absolute;
      right: 20px;
      top: 14px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.8);
      background: rgba(15,23,42,0.86);
      font-size: 11px;
      color: var(--text-main);
      box-shadow: 0 10px 24px rgba(0,0,0,0.8);
    }

    .hint-hud {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(250,204,21,0.9);
      background: radial-gradient(circle at top, rgba(15,23,42,0.96), rgba(30,64,175,0.9));
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.9);
      z-index: 2;
    }

    .hint-hud-label {
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .hint-hud-status {
      color: var(--text-main);
    }

    .hint-hud button {
      padding: 6px 10px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      background: linear-gradient(135deg, #ffca5c, #f7a600);
      color: #111827;
      box-shadow: 0 10px 24px rgba(251,191,36,0.7);
    }

    .hint-hud button:hover {
      box-shadow: 0 16px 32px rgba(251,191,36,0.9);
      transform: translateY(-1px);
    }

    .world-timer {
      position: absolute;
      right: 20px;
      top: 14px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.8);
      background: rgba(15,23,42,0.86);
      font-size: 11px;
      color: var(--text-main);
      box-shadow: 0 10px 24px rgba(0,0,0,0.8);
    }

    .shell {
      position: relative;
      z-index: 1;
      max-width: 340px;
      width: 100%;
      margin: 16px;
      padding: 20px 22px 22px;
      border-radius: 24px;
      background: rgba(15,23,42,0.9);
      border: 1px solid rgba(148,163,184,0.55);
      box-shadow: 0 24px 60px rgba(0,0,0,0.9);
      position: fixed;
      right: 16px;
      top: 16px;
      bottom: 16px;
      display: flex;
      flex-direction: column;
      transform: translateX(0);
      transition: transform 180ms ease-out, opacity 180ms ease-out;
    }

    .shell-hidden {
      transform: translateX(120%);
      opacity: 0;
    }

    .shell-toggle {
      position: fixed;
      right: 16px;
      top: 50%;
      z-index: 2;
      transform: translateY(-50%);
      padding: 6px 10px;
      border-radius: 999px 0 0 999px;
      border: 1px solid rgba(148,163,184,0.7);
      background: rgba(15,23,42,0.9);
      color: var(--text-main);
      font-size: 11px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(0,0,0,0.85);
    }

    @keyframes worldFloat {
      0% {
        transform: translate3d(0, 0, 0) scale(1.02);
      }
      50% {
        transform: translate3d(-10px, -6px, 0) scale(1.04);
      }
      100% {
        transform: translate3d(8px, 4px, 0) scale(1.03);
      }
    }
    @keyframes worldShake {
      0% { transform: translate3d(0, 0, 0); }
      25% { transform: translate3d(-4px, 2px, 0); }
      50% { transform: translate3d(3px, -3px, 0); }
      75% { transform: translate3d(-2px, 1px, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }
    .world-shake {
      animation: worldShake 0.25s ease-out;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .title-block h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .title-block p {
      margin: 2px 0 0;
      font-size: 11px;
      color: var(--text-muted);
    }
    .timer-pill {
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.7);
      font-size: 11px;
      color: var(--text-muted);
    }
    .content {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
    }
    @media (max-width: 900px) {
      .content {
        grid-template-columns: minmax(0, 1fr);
      }
    }
    .hint-panel {
      font-size: 12px;
      color: var(--text-muted);
      border-radius: 16px;
      padding: 8px 10px;
      border: 1px solid rgba(148,163,184,0.55);
      background: radial-gradient(circle at top left, rgba(15,23,42,0.94), rgba(30,64,175,0.7));
    }

    .room-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: none;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, rgba(15,23,42,0.55), rgba(0,0,0,0.9));
      backdrop-filter: blur(10px);
    }

    .room-modal {
      max-width: 70vw;
      max-height: 70vh;
      border-radius: 20px;
      padding: 12px 12px 14px;
      background: rgba(15,23,42,0.96);
      border: 1px solid rgba(250,204,21,0.75);
      box-shadow: 0 26px 60px rgba(0,0,0,0.95);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .room-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }

    .room-modal-title {
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .room-modal-close {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
    }

    .room-modal-close:hover {
      color: var(--accent);
    }

    .room-image {
      width: 100%;
      max-height: 50vh;
      object-fit: contain;
      border-radius: 14px;
      border: 1px solid rgba(148,163,184,0.7);
      box-shadow: 0 18px 40px rgba(0,0,0,0.85);
    }

    .room-caption {
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="veil" aria-hidden="true"></div>
  <div class="world-frame" id="worldFrame">
    <div class="world-timer"><span id="worldTimer">--:--</span></div>
    <!-- 8 hotspots over the world image, roughly aligned to the labeled rooms -->
    <!-- 1. Great Hall -->
    <button class="world-hotspot" data-room="Great Hall" data-id="1"
            style="left:0%; top:4%; width:28%; height:20%;"></button>
    <!-- 2. Potions Classroom -->
    <button class="world-hotspot" data-room="Potions Classroom" data-id="2"
            style="left:39%; top:6%; width:22%; height:18%;"></button>
    <!-- 3. Library -->
    <button class="world-hotspot" data-room="Library" data-id="3"
            style="left:69%; top:6%; width:22%; height:18%;"></button>
    <!-- 4. Herbology Greenhouse -->
    <button class="world-hotspot" data-room="Herbology Greenhouse" data-id="4"
            style="left:4%; top:38%; width:22%; height:20%;"></button>
    <!-- 5. Defense Classroom -->
    <button class="world-hotspot" data-room="Defense Classroom" data-id="5"
            style="left:69%; top:38%; width:22%; height:20%;"></button>
    <!-- 6. Common Room -->
    <button class="world-hotspot" data-room="Common Room" data-id="6"
            style="left:10%; top:67%; width:26%; height:22%;"></button>
    <!-- 7. Astronomy Tower -->
    <button class="world-hotspot" data-room="Astronomy Tower" data-id="7"
            style="left:41%; top:67%; width:22%; height:22%;"></button>
    <!-- 8. Headmaster's Office -->
    <button class="world-hotspot" data-room="Headmaster's Office" data-id="8"
            style="left:69%; top:67%; width:22%; height:22%;"></button>
  </div>
  <div class="hint-hud">
    <span class="hint-hud-label">Your hints</span>
    <span class="hint-hud-status" id="worldHintHelper">Loading…</span>
    <button id="btnRequestHint" type="button">Request hint</button>
  </div>
  <div class="room-modal-overlay" id="roomModal">
    <div class="room-modal">
      <div class="room-modal-header">
        <div class="room-modal-title" id="roomTitle">Room</div>
        <button class="room-modal-close" id="roomClose" aria-label="Close room view">×</button>
      </div>
      <img id="roomImage" class="room-image" alt="Selected room view"/>
      <div class="room-caption" id="roomCaption">
      </div>
    </div>
  </div>
  <!-- sidebar removed; using compact hint HUD instead -->
  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session') || '';
    const username = params.get('name') || '';

    const helperEl = document.getElementById('worldHintHelper');
    const hintsEl = document.getElementById('hints');
    const btnHint = document.getElementById('btnRequestHint');
    const timerLabelEl = document.getElementById('worldTimer');
    const roomModalEl = document.getElementById('roomModal');
    const roomImageEl = document.getElementById('roomImage');
    const roomTitleEl = document.getElementById('roomTitle');
    const roomCaptionEl = document.getElementById('roomCaption');
    const roomCloseBtn = document.getElementById('roomClose');

    const socket = io();
    const my = { session: sessionId, name: username };
    let hintsUnlocked = true; // we only arrive here after hints_ready
    let hintsLeft = 0;
    let hintsUsed = 0;
    let artifactsLeft = null;
    let myScore = 0;

    function updateHintHelperText() {
      if (!helperEl) return;
      if (hintsLeft <= 0 && hintsUsed === 0) {
        helperEl.textContent = 'You are the imposter. You have no hints, but you can subtly twist the clues others receive.';
        if (btnHint) btnHint.disabled = true;
      } else if (hintsLeft <= 0) {
        helperEl.textContent = `Hints left: 0 · Used: ${hintsUsed}`;
        if (btnHint) btnHint.disabled = true;
      } else {
        helperEl.textContent = `Hints left: ${hintsLeft} · Used: ${hintsUsed}` + (artifactsLeft !== null ? ` · Artifacts left: ${artifactsLeft} · Score: ${myScore}` : '');
        if (btnHint) btnHint.disabled = false;
      }
    }

    function loadSessionState() {
      if (!sessionId) {
        if (helperEl) helperEl.textContent = 'Missing session id in URL.';
        return;
      }
      fetch(`/status/${encodeURIComponent(sessionId)}`)
        .then(r => r.json())
        .then(data => {
          const players = data.players || [];
          const me = players.find(p => p.name === username);
          if (typeof data.artifacts_total === 'number' && typeof data.artifacts_claimed === 'number') {
            artifactsLeft = Math.max(0, data.artifacts_total - data.artifacts_claimed);
          }
          if (me) {
            if (typeof me.score === 'number') {
              myScore = me.score;
            }
            if (typeof me.hints_left === 'number') {
              hintsLeft = me.hints_left;
              hintsUsed = 0;
              updateHintHelperText();
            } else if (helperEl) {
              helperEl.textContent = 'Your role is ready — hints are now active.';
            }
          } else if (helperEl) {
            helperEl.textContent = 'You are in the realm as an observer.';
          }
        })
        .catch(() => {
          if (helperEl) helperEl.textContent = 'Unable to load session state.';
        });
    }

    // Make the world image clickable via 8 hotspots placed over the artwork.
    const worldFrameEl = document.getElementById('worldFrame');
    if (worldFrameEl) {
      const ROOM_CAPTIONS = {
        'Great Hall': 'A vast chamber of floating candles and echoing footsteps. Artifacts here tend to hide in plain sight among feasts and banners.',
        'Potions Classroom': 'Glowing brews and arcane instruments hum. Relics lurk near cauldrons, shelves, and chalk circles.',
        'Library': 'Shelves spiral into the shadows. Relics lurk between forgotten tomes and moonlit reading alcoves.',
        'Herbology Greenhouse': 'Glass domes and rare plants refract starlight; artifacts disguise themselves as crystal, root, or stone.',
        'Defense Classroom': 'Runic circles and training dummies surround a central focus. Look near chalk sigils and weapon racks.',
        'Common Room': 'A warm hearth and deep armchairs. Items hide among cushions, tables, and mantlepieces.',
        'Astronomy Tower': 'Wind howls around telescopes and parapets. Sky‑touched artifacts cling to ledges and rafters.',
        'Headmaster\'s Office': 'Portraits, cabinets, and a grand desk. Powerful artifacts are kept close, but rarely in plain sight.'
      };
      const audioCtx = window.AudioContext ? new AudioContext() : null;

      function playRoomClickSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      }

      worldFrameEl.addEventListener('click', (ev) => {
        const hotspot = ev.target.closest('.world-hotspot');
        if (!hotspot) return;
        const room = hotspot.getAttribute('data-room') || 'Unknown room';
        const id = hotspot.getAttribute('data-id');
        if (roomModalEl && roomImageEl && roomTitleEl && roomCaptionEl && id) {
          roomImageEl.src = '/image/rooms/' + String(id) + '.png';
          roomTitleEl.textContent = room;
          roomCaptionEl.textContent = ROOM_CAPTIONS[room] || 'A mysterious chamber where artifacts may lurk in the shadows.';
          roomModalEl.style.display = 'flex';
          playRoomClickSound();
          worldFrameEl.classList.add('world-shake');
          setTimeout(() => worldFrameEl.classList.remove('world-shake'), 250);
        }
      });
    }

    if (roomCloseBtn && roomModalEl) {
      roomCloseBtn.onclick = () => {
        roomModalEl.style.display = 'none';
      };
    }

    // Join the world view room so we receive hint responses and time updates.
    if (sessionId) {
      socket.emit('join_world_view', { session_id: sessionId });
    }

    if (btnHint) {
      btnHint.onclick = () => {
        if (!hintsUnlocked) {
          alert('Hints are not available yet.');
          return;
        }
        if (!my.session || !my.name) {
          alert('Missing session or name in URL.');
          return;
        }
        socket.emit('request_hint', { session_id: my.session, username: my.name });
      };
    }

    socket.on('hint_response', (d) => {
      if (d.error) {
        alert('Hint error: ' + d.error);
        return;
      }
      const card = document.createElement('div');
      card.style.borderRadius = '10px';
      card.style.border = '1px solid rgba(148,163,184,0.7)';
      card.style.background = 'linear-gradient(135deg, rgba(15,23,42,0.98), rgba(56,189,248,0.9))';
      card.style.padding = '8px 9px 7px';
      card.style.fontSize = '12px';
      card.style.boxShadow = '0 10px 18px rgba(15,23,42,0.85)';

      const art = document.createElement('div');
      art.style.fontSize = '11px';
      art.style.textTransform = 'uppercase';
      art.style.letterSpacing = '0.14em';
      art.style.color = 'rgba(191,219,254,0.95)';
      art.style.marginBottom = '2px';
      art.textContent = d.artifact || 'Unknown artifact';

      const text = document.createElement('div');
      text.style.fontSize = '12px';
      text.style.color = '#e5e7eb';
      text.textContent = d.clue || '';

      const meta = document.createElement('div');
      meta.style.marginTop = '4px';
      meta.style.fontSize = '10px';
      meta.style.textTransform = 'uppercase';
      meta.style.letterSpacing = '0.16em';
      meta.style.color = 'rgba(148,163,184,0.9)';
      meta.textContent = 'Hint channel · beware of illusions';

      card.appendChild(art);
      card.appendChild(text);
      card.appendChild(meta);

      hintsEl.prepend(card);
      hintsUsed += 1;
      if (hintsLeft > 0) {
        hintsLeft -= 1;
      }
      updateHintHelperText();
    });

    let localSeconds = null;
    let timerInterval = null;

    function updateTimerDisplay(seconds) {
      if (!timerLabelEl) return;
      const s = Math.max(0, seconds | 0);
      const m = Math.floor(s / 60);
      const r = s % 60;
      const text =
        (m < 10 ? '0' + m : String(m)) +
        ':' +
        (r < 10 ? '0' + r : String(r));
      timerLabelEl.textContent = text;
    }

    socket.on('time_tick', (d) => {
      if (typeof d.time_left === 'number') {
        if (localSeconds === null || d.time_left < localSeconds) {
          localSeconds = d.time_left;
          updateTimerDisplay(localSeconds);
        }
        if (!timerInterval) {
          timerInterval = setInterval(() => {
            if (localSeconds === null) return;
            localSeconds = Math.max(0, localSeconds - 1);
            updateTimerDisplay(localSeconds);
          }, 1000);
        }
      }
    });

    socket.on('artifact_update', (d) => {
      if (!d || !d.result) return;
      const res = d.result;
      if (typeof res.artifacts_remaining === 'number') {
        artifactsLeft = res.artifacts_remaining;
      }
      if (d.username === username && typeof res.score === 'number') {
        myScore = res.score;
      }
      updateHintHelperText();
    });

    socket.on('game_over', (d) => {
      alert('Game Over: ' + (d.reason || 'check main tab for results.'));
    });

    loadSessionState();
  </script>
</body>
</html>
